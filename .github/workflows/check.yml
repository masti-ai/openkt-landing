name: check

# Pre-merge / pre-deploy gates for openkt-landing. Runs in parallel with
# Deploy to Cloudflare Pages — the gates here MUST pass before the Pages
# deploy is considered safe to promote to production. On PRs, this
# workflow is the required status check for merge.
#
# Why a separate workflow (vs adding steps to deploy.yml)?
#   1. Cloudflare's wrangler deploy step writes to a third-party API;
#      keeping it isolated means a flaky lint step can't accidentally
#      block a critical hotfix deploy.
#   2. Status checks read better when separated by intent (deploy vs
#      verify). Branch protection lists are easier to maintain.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        # Static export → next build covers this, but failing-fast on a
        # pure type error saves 30s+ of building the whole route tree.
        run: npx tsc --noEmit

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        # Browser binaries are heavy (~200MB) but only Chromium is
        # required per playwright.config.ts; --with-deps installs the
        # OS-level libs Playwright needs on a fresh GitHub runner.
        run: npx playwright install --with-deps chromium

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run e2e tests
        # playwright.config.ts's webServer block starts `npm run preview`
        # which serves out/ on PORT=3100; the test suite waits for that
        # before running. forbidOnly enforces no test.only slipped past
        # review.
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
